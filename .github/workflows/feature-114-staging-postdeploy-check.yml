name: Feature 114 staging postdeploy check

on:
  push:
    branches:
      - feature-114-compliance-runtime
    paths:
      - ".github/workflows/feature-114-staging-postdeploy-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-114-compliance-runtime
          token: ${{ github.token }}
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          ssh-keyscan -H -T 15 "$STAGING_SSH_HOST" > "$HOME/.ssh/known_hosts"
      - name: Record current staging state
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="$(ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o ConnectTimeout=15 "$STAGING_SSH_USER@$STAGING_SSH_HOST" '
            set -eu
            created="$(docker inspect mentorandi-staging --format "{{.Created}}" 2>/dev/null || echo missing)"
            image="$(docker inspect mentorandi-staging --format "{{.Config.Image}}" 2>/dev/null || echo missing)"
            marker="$(docker exec mentorandi-staging cat /app/public/feature-114-preview-marker.txt 2>/dev/null || echo missing)"
            printf "created=%s\nimage=%s\nmarker=%s\n" "$created" "$image" "$marker"
          ')"
          health_code="$(curl --connect-timeout 10 --max-time 20 --silent --output /dev/null --write-out '%{http_code}' "${STAGING_APP_URL%/}/api/health" 2>/dev/null || true)"
          public_code="$(curl --connect-timeout 10 --max-time 20 --silent --output /dev/null --write-out '%{http_code}' "${STAGING_APP_URL%/}/feature-114-preview-marker.txt" 2>/dev/null || true)"
          public_marker="$(curl --connect-timeout 10 --max-time 20 --silent "${STAGING_APP_URL%/}/feature-114-preview-marker.txt" 2>/dev/null || true)"
          mkdir -p docs/staging-diagnostics
          file="docs/staging-diagnostics/postdeploy-${GITHUB_SHA}.txt"
          {
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' "$remote"
            printf 'health_http_code=%s\n' "$health_code"
            printf 'public_marker_http_code=%s\n' "$public_code"
            printf 'public_marker=%s\n' "$public_marker"
          } > "$file"
          git config user.name "MentorAndI staging diagnostic"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add "$file"
          git commit -m "Record postdeploy staging state"
          git push origin HEAD:feature-114-compliance-runtime
