name: Complete mentor notes integration

on:
  push:
    branches:
      - mentor-notes
    paths:
      - .github/workflows/mentor-notes-wireup-v3.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mentor-notes

      - name: Patch non-workflow mentor notes integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text missing in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "services/mentor-core/response-formatting/mentor-response-formatting.ts",
              '  "Do not use Markdown bold markers such as **text**. Use plain short section labels, clean line breaks, and simple hyphen lists when structure helps.",\n] as const;',
              '  "Do not use Markdown bold markers such as **text**. Use plain short section labels, clean line breaks, and simple hyphen lists when structure helps.",\n  "Only when the response contains a concrete technique, practice, plan, or reusable reminder that would genuinely help the user later, append exactly one internal line after the user-facing response using this shape: <mentor_note>{\\\"type\\\":\\\"TECHNIQUE\\\",\\\"title\\\":\\\"Short title\\\",\\\"content\\\":\\\"Concise standalone note\\\"}</mentor_note>. Use only TECHNIQUE, PRACTICE, PLAN, or REMEMBER. Do not create a note for ordinary reflection, validation, chit-chat, or one-off factual answers. Keep the title under 120 characters and the content under 600 characters. Never mention this internal tag to the user.",\n] as const;'
          )

          replace_once(
              "services/mentor-core/response-pipeline/response-pipeline.service.ts",
              'import { normalizeMentorResponseFormatting } from "@/services/mentor-core/response-formatting/mentor-response-formatting";\n',
              'import { normalizeMentorResponseFormatting } from "@/services/mentor-core/response-formatting/mentor-response-formatting";\nimport { MentorNoteService } from "@/services/mentor-notes/mentor-note.service";\nimport { parseMentorResponseForNote } from "@/services/mentor-notes/mentor-note-parser";\nimport type { MentorNoteCandidate } from "@/services/mentor-notes/mentor-note.types";\n'
          )
          replace_once(
              "services/mentor-core/response-pipeline/response-pipeline.service.ts",
              '    private readonly memoryService = new MemoryService(),\n',
              '    private readonly memoryService = new MemoryService(),\n    private readonly mentorNoteService = new MentorNoteService(),\n'
          )
          replace_once(
              "services/mentor-core/response-pipeline/response-pipeline.service.ts",
              '      const mentorMessage = await this.messageService.createMessage(\n        input.conversationId,\n        {\n          content: normalizeMentorResponseFormatting(llmResponse.content),\n          role: MessageRole.MENTOR,\n        },\n        authContext,\n      );\n      const memoryStorageResult = await this.extractAndStoreMemories(input);',
              '      const parsedMentorResponse = parseMentorResponseForNote(llmResponse.content);\n      const mentorMessage = await this.messageService.createMessage(\n        input.conversationId,\n        {\n          content: normalizeMentorResponseFormatting(parsedMentorResponse.content),\n          role: MessageRole.MENTOR,\n        },\n        authContext,\n      );\n      await this.storeMentorNoteIfPresent({\n        candidate: parsedMentorResponse.note,\n        conversationId: input.conversationId,\n        mentorId: context.mentor.id,\n        userId: input.userId,\n      });\n      const memoryStorageResult = await this.extractAndStoreMemories(input);'
          )
          replace_once(
              "services/mentor-core/response-pipeline/response-pipeline.service.ts",
              '  private async createReflectionForMoment(\n',
              '''  private async storeMentorNoteIfPresent(input: {\n    candidate: MentorNoteCandidate | null;\n    conversationId: string;\n    mentorId: string;\n    userId: string;\n  }) {\n    if (!input.candidate) {\n      return;\n    }\n\n    try {\n      await this.mentorNoteService.createFromMentorResponse({\n        candidate: input.candidate,\n        conversationId: input.conversationId,\n        mentorId: input.mentorId,\n        userId: input.userId,\n      });\n    } catch {\n      // Mentor notes are useful follow-up material, but must never block the conversation.\n    }\n  }\n\n  private async createReflectionForMoment(\n'''
          )

          replace_once(
              "services/account-data/account-data.repository.ts",
              '      memories,\n      goals,\n      reflections,',
              '      memories,\n      mentorNotes,\n      goals,\n      reflections,'
          )
          replace_once(
              "services/account-data/account-data.repository.ts",
              '      this.prisma.memory.findMany({\n        orderBy: {\n          createdAt: "asc",\n        },\n        where: { userId },\n      }),\n      this.prisma.goal.findMany({',
              '      this.prisma.memory.findMany({\n        orderBy: {\n          createdAt: "asc",\n        },\n        where: { userId },\n      }),\n      this.prisma.mentorNote.findMany({\n        include: { mentor: { select: { name: true, slug: true } } },\n        orderBy: { createdAt: "asc" },\n        where: { userId },\n      }),\n      this.prisma.goal.findMany({'
          )
          replace_once(
              "services/account-data/account-data.repository.ts",
              '      memories,\n      messages,\n      reflections,',
              '      memories,\n      mentorNotes,\n      messages,\n      reflections,'
          )
          replace_once(
              "services/account-data/account-data.repository.ts",
              '      const deletedMessages = await transaction.message.deleteMany({',
              '      const deletedMentorNotes = await transaction.mentorNote.deleteMany({\n        where: { userId },\n      });\n      const deletedMessages = await transaction.message.deleteMany({'
          )
          replace_once(
              "services/account-data/account-data.repository.ts",
              '        deletedMemories: deletedMemories.count,\n        deletedMessages: deletedMessages.count,',
              '        deletedMemories: deletedMemories.count,\n        deletedMentorNotes: deletedMentorNotes.count,\n        deletedMessages: deletedMessages.count,'
          )
          replace_once(
              "services/account-data/account-data.service.ts",
              '      memories: data.memories,\n      messages: data.messages,',
              '      memories: data.memories,\n      mentorNotes: data.mentorNotes,\n      messages: data.messages,'
          )
          replace_once(
              "services/account-data/account-data.types.ts",
              '  deletedMemories: number;\n  deletedMessages: number;',
              '  deletedMemories: number;\n  deletedMentorNotes: number;\n  deletedMessages: number;'
          )

          p = Path("prisma/security/rls-hardening.sql")
          text = p.read_text()
          text, count = re.subn(r"('Memory',\n\s*)('Goal')", r"\1'MentorNote',\n      \2", text)
          if count != 2:
              raise SystemExit(f"Expected 2 RLS Memory/Goal table-list matches, found {count}")
          p.write_text(text)

          p = Path("prisma/schema.prisma")
          text = p.read_text().replace(
              'specialistPackName       String?          @db.VarChar(64)',
              'specialistPackName       String?'
          )
          p.write_text(text)

          Path("scripts/run-mentor-notes-test.mjs").write_text('''import assert from "node:assert/strict";\nimport { createRequire } from "node:module";\n\nconst require = createRequire(import.meta.url);\nconst jiti = require("jiti")(__filename);\nconst { parseMentorResponseForNote } = jiti("../services/mentor-notes/mentor-note-parser.ts");\n\nconst tagged = parseMentorResponseForNote(`Try the two-second pause before answering.\\n<mentor_note>{"type":"TECHNIQUE","title":"Two-second pause","content":"Pause for two seconds before answering in a pressured conversation."}</mentor_note>`);\nassert.equal(tagged.content, "Try the two-second pause before answering.");\nassert.equal(tagged.note?.type, "TECHNIQUE");\nassert.equal(tagged.note?.title, "Two-second pause");\nassert.ok(!tagged.content.includes("mentor_note"));\n\nconst ordinary = parseMentorResponseForNote("That sounds like useful progress.");\nassert.equal(ordinary.note, null);\nassert.equal(ordinary.content, "That sounds like useful progress.");\n\nconst malformed = parseMentorResponseForNote(`Keep this in mind.\\n<mentor_note>not-json</mentor_note>`);\nassert.equal(malformed.note, null);\nassert.equal(malformed.content, "Keep this in mind.");\n\nconsole.log("Mentor notes parser tests passed.");\n''')

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["scripts"]["test:mentor-notes"] = "node scripts/run-mentor-notes-test.mjs"
          package_path.write_text(json.dumps(package, indent=2) + "\n")
          PY

      - name: Commit non-workflow integration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add services prisma scripts package.json
          git commit -m "Wire mentor notes into mentor responses"
          git push origin mentor-notes
