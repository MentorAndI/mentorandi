name: Deploy staging

on:
  push:
    branches:
      - main
      - app-brand-design-system
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mentorandi-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$STAGING_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ -n "$STAGING_SSH_KEY" ]]
          [[ "$STAGING_APP_URL" =~ ^https://[^[:space:]]+$ ]]
          [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "app-brand-design-system" ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/staging_deploy_key"
          chmod 600 "$HOME/.ssh/staging_deploy_key"
          ssh-keyscan -H -T 15 "$STAGING_SSH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit to staging container
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/staging_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- '$GITHUB_REF_NAME' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          deploy_ref="$1"
          deploy_sha="$2"
          repo_dir="/docker/mentorandi"

          if [ "$deploy_ref" = "main" ]; then
            cd "$repo_dir"
            git fetch origin main
            git pull --ff-only origin main
            docker compose --env-file .env.staging -f docker-compose.staging.yml --profile tools build mentorandi-staging-migrate
            docker compose --env-file .env.staging -f docker-compose.staging.yml --profile tools run --rm mentorandi-staging-migrate
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
          else
            preview_dir="/docker/mentorandi-staging-preview-app-brand-design-system"
            cd "$repo_dir"
            git fetch origin app-brand-design-system
            git cat-file -e "$deploy_sha^{commit}"
            git worktree remove --force "$preview_dir" 2>/dev/null || true
            rm -rf "$preview_dir"
            git worktree add --force --detach "$preview_dir" "$deploy_sha"
            ln -s "$repo_dir/.env.staging" "$preview_dir/.env.staging"
            printf '%s\n' "$deploy_sha" > "$preview_dir/public/design-preview-marker.txt"

            cat > "$preview_dir/docker-compose.preview.yml" <<EOF
          services:
            mentorandi-staging:
              image: mentorandi-staging-preview:${deploy_sha}
          EOF

            cd "$preview_dir"
            docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml --profile tools build mentorandi-staging-migrate
            docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml --profile tools run --rm mentorandi-staging-migrate
            docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml -f docker-compose.preview.yml build --no-cache mentorandi-staging
            docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml -f docker-compose.preview.yml up -d --force-recreate --no-deps mentorandi-staging

            expected_image="$(docker image inspect "mentorandi-staging-preview:${deploy_sha}" --format '{{.Id}}')"
            running_image="$(docker inspect mentorandi-staging --format '{{.Image}}')"
            [ "$expected_image" = "$running_image" ]
          fi
          REMOTE

      - name: Publish deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          case "$OUTCOME" in success) state=success ;; failure) state=failure ;; *) state=error ;; esac
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"staging-preview-deploy\"}" >/dev/null

      - name: Verify commit marker inside staging container
        id: container_marker
        if: steps.deploy.outcome == 'success' && github.ref_name == 'app-brand-design-system'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          marker="$(ssh \
            -i "$HOME/.ssh/staging_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            'docker exec mentorandi-staging cat /app/public/design-preview-marker.txt')"
          [[ "$marker" == "$GITHUB_SHA" ]]

      - name: Publish container marker status
        if: always() && github.ref_name == 'app-brand-design-system'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.container_marker.outcome }}
        shell: bash
        run: |
          case "$OUTCOME" in success) state=success ;; failure) state=failure ;; *) state=error ;; esac
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"staging-preview-container\"}" >/dev/null

      - name: Verify public staging commit marker and health
        id: public_marker
        if: steps.deploy.outcome == 'success' && github.ref_name == 'app-brand-design-system'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 10

          health_response="$(curl --connect-timeout 10 --fail --max-time 20 --retry 6 --retry-all-errors --retry-delay 5 --show-error --silent "${STAGING_APP_URL%/}/api/health")"
          HEALTH_RESPONSE="$health_response" node <<'NODE'
          const health = JSON.parse(process.env.HEALTH_RESPONSE ?? "");
          if (health.status !== "ok") process.exit(1);
          NODE

          public_marker="$(curl --connect-timeout 10 --fail --max-time 20 --retry 6 --retry-all-errors --retry-delay 5 --show-error --silent "${STAGING_APP_URL%/}/design-preview-marker.txt")"
          [[ "$public_marker" == "$GITHUB_SHA" ]]

      - name: Publish public marker status
        if: always() && github.ref_name == 'app-brand-design-system'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.public_marker.outcome }}
        shell: bash
        run: |
          case "$OUTCOME" in success) state=success ;; failure) state=failure ;; *) state=error ;; esac
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"staging-preview-public\"}" >/dev/null

      - name: Enforce staging preview verification
        if: github.ref_name == 'app-brand-design-system'
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CONTAINER_OUTCOME: ${{ steps.container_marker.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public_marker.outcome }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_OUTCOME" == "success" ]]
          [[ "$CONTAINER_OUTCOME" == "success" ]]
          [[ "$PUBLIC_OUTCOME" == "success" ]]
