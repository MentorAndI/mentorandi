name: One-time production route-runtime verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-route-runtime-verification.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://app.mentorandi.com
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Wait for hidden legacy routes
        shell: bash
        run: |
          set -Eeuo pipefail
          out=.launch-route-runtime-result.txt
          : > "$out"

          check_all() {
            for route in alpha demo match reflection welcome; do
              effective="$(curl --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 --silent --show-error --location --output /dev/null --write-out '%{url_effective}' "$APP_URL/$route")" || return 1
              printf '%s -> %s\n' "$route" "$effective" >> "$out"
              [[ "$effective" == "$APP_URL/login"* ]] || return 1
            done
            return 0
          }

          for attempt in $(seq 1 30); do
            : > "$out"
            if check_all; then
              echo 'result=PASS' >> "$out"
              exit 0
            fi
            sleep 5
          done

          echo 'result=FAIL' >> "$out"
          exit 1

      - name: Commit result and remove workflow
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-time-route-runtime-verification.yml
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add -A
          git commit -m "Capture production route-runtime verification"
          git push origin HEAD:main
