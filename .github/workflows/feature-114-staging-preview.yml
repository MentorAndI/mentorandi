name: Feature 114 staging preview

on:
  push:
    branches:
      - feature-114-compliance-runtime
    paths:
      - ".github/workflows/feature-114-staging-preview.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: mentorandi-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$STAGING_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ -n "$STAGING_SSH_KEY" ]]
          [[ "$STAGING_APP_URL" =~ ^https://[^[:space:]]+$ ]]
          [[ "$GITHUB_REF_NAME" == "feature-114-compliance-runtime" ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/staging_deploy_key"
          chmod 600 "$HOME/.ssh/staging_deploy_key"
          ssh-keyscan -H -T 15 "$STAGING_SSH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact Feature 114 commit
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/staging_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          deploy_sha="$1"
          repo_dir="/docker/mentorandi"
          preview_dir="/docker/mentorandi-staging-preview-feature-114"
          preview_image="mentorandi-feature-114-preview:${deploy_sha}"

          cd "$repo_dir"
          git fetch origin feature-114-compliance-runtime
          git cat-file -e "$deploy_sha^{commit}"
          git worktree remove --force "$preview_dir" 2>/dev/null || true
          rm -rf "$preview_dir"
          git worktree add --force --detach "$preview_dir" "$deploy_sha"
          ln -s "$repo_dir/.env.staging" "$preview_dir/.env.staging"
          printf '%s\n' "$deploy_sha" > "$preview_dir/public/feature-114-preview-marker.txt"

          cat > "$preview_dir/docker-compose.preview.yml" <<EOF
          services:
            mentorandi-staging:
              image: ${preview_image}
              build:
                context: .
                dockerfile: Dockerfile
                args:
                  NEXT_PUBLIC_SUPABASE_URL: \${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in the staging env file}
                  NEXT_PUBLIC_SUPABASE_ANON_KEY: \${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY in the staging env file}
                  NEXT_PUBLIC_STRIPE_ENABLED: \${NEXT_PUBLIC_STRIPE_ENABLED:-false}
          EOF

          cd "$preview_dir"

          # Apply migrations using the branch code and staging environment.
          docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml --profile tools build mentorandi-staging-migrate
          docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml --profile tools run --rm mentorandi-staging-migrate

          # Build the application with an immutable per-commit tag.
          docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml -f docker-compose.preview.yml build --no-cache mentorandi-staging

          # Prove the image itself contains the requested commit before it can be started.
          image_marker="$(docker run --rm --entrypoint cat "$preview_image" /app/public/feature-114-preview-marker.txt)"
          [ "$image_marker" = "$deploy_sha" ]

          # Prove Compose resolves the service to the immutable preview tag.
          resolved_image="$(docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml -f docker-compose.preview.yml config --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);process.stdout.write(c.services["mentorandi-staging"].image||"")})')"
          [ "$resolved_image" = "$preview_image" ]

          docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml -f docker-compose.preview.yml up -d --force-recreate --no-deps mentorandi-staging

          # Verify both the exact configured tag and content of the running container.
          running_tag="$(docker inspect mentorandi-staging --format '{{.Config.Image}}')"
          [ "$running_tag" = "$preview_image" ]
          running_marker="$(docker exec mentorandi-staging cat /app/public/feature-114-preview-marker.txt)"
          [ "$running_marker" = "$deploy_sha" ]
          REMOTE

      - name: Publish deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          case "$OUTCOME" in success) state=success ;; failure) state=failure ;; *) state=error ;; esac
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"feature-114-staging-deploy\"}" >/dev/null

      - name: Verify exact commit inside running container
        id: container_marker
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(ssh \
            -i "$HOME/.ssh/staging_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          expected="$1"
          expected_tag="mentorandi-feature-114-preview:${expected}"
          for attempt in $(seq 1 30); do
            state="$(docker inspect mentorandi-staging --format '{{.State.Status}}' 2>/dev/null || true)"
            tag="$(docker inspect mentorandi-staging --format '{{.Config.Image}}' 2>/dev/null || true)"
            marker="$(docker exec mentorandi-staging cat /app/public/feature-114-preview-marker.txt 2>/dev/null || true)"
            if [ "$state" = "running" ] && [ "$tag" = "$expected_tag" ] && [ "$marker" = "$expected" ]; then
              printf '%s' "$marker"
              exit 0
            fi
            sleep 2
          done
          exit 1
          REMOTE
          )"
          [[ "$result" == "$GITHUB_SHA" ]]

      - name: Publish container marker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.container_marker.outcome }}
        shell: bash
        run: |
          case "$OUTCOME" in success) state=success ;; failure) state=failure ;; *) state=error ;; esac
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"feature-114-staging-container\"}" >/dev/null

      - name: Verify public staging marker and health
        id: public_marker
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 24); do
            health_response="$(curl --connect-timeout 10 --max-time 20 --silent --show-error "${STAGING_APP_URL%/}/api/health" 2>/dev/null || true)"
            health_ok="$(HEALTH_RESPONSE="$health_response" node <<'NODE'
          try {
            const health = JSON.parse(process.env.HEALTH_RESPONSE ?? "");
            process.stdout.write(health.status === "ok" ? "yes" : "no");
          } catch {
            process.stdout.write("no");
          }
          NODE
            )"
            public_marker="$(curl --connect-timeout 10 --max-time 20 --silent --show-error "${STAGING_APP_URL%/}/feature-114-preview-marker.txt" 2>/dev/null || true)"
            if [[ "$health_ok" == "yes" && "$public_marker" == "$GITHUB_SHA" ]]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish public marker status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.public_marker.outcome }}
        shell: bash
        run: |
          case "$OUTCOME" in success) state=success ;; failure) state=failure ;; *) state=error ;; esac
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"feature-114-staging-public\"}" >/dev/null

      - name: Enforce verification
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CONTAINER_OUTCOME: ${{ steps.container_marker.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public_marker.outcome }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_OUTCOME" == "success" ]]
          [[ "$CONTAINER_OUTCOME" == "success" ]]
          [[ "$PUBLIC_OUTCOME" == "success" ]]
