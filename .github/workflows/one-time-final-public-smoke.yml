name: One-time final production smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-final-public-smoke.yml"

permissions:
  contents: write
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://app.mentorandi.com
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Report smoke pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"pending\",\"context\":\"final-public-smoke\",\"target_url\":\"$run_url\"}" >/dev/null
      - name: Verify health and public entry
        shell: bash
        run: |
          set -Eeuo pipefail
          health="$(curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health")"
          HEALTH="$health" node -e 'const h=JSON.parse(process.env.HEALTH||""); if(h.status!=="ok"||h.database!=="connected"||h.auth!=="configured") process.exit(1)'
          effective="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{url_effective}' "$APP_URL/")"
          [[ "$effective" == "$APP_URL/login"* ]]
      - name: Verify legacy production routes are hidden
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in alpha demo match reflection welcome; do
            effective="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{url_effective}' "$APP_URL/$path")"
            [[ "$effective" == "$APP_URL/login"* ]] || { echo "$path ended at $effective" >&2; exit 1; }
          done
      - name: Verify canonical legal redirects
        shell: bash
        run: |
          set -Eeuo pipefail
          privacy="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{url_effective}' "$APP_URL/privacy")"
          terms="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{url_effective}' "$APP_URL/terms")"
          [[ "$privacy" == "https://mentorandi.com/privacy.html"* ]]
          [[ "$terms" == "https://mentorandi.com/terms.html"* ]]
      - name: Verify pricing, signup, and dev route
        shell: bash
        run: |
          set -Eeuo pipefail
          pricing_code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$APP_URL/pricing")"
          [[ "$pricing_code" == "200" ]]
          signup="$(curl --fail --silent --show-error --max-time 20 "$APP_URL/signup")"
          grep -Fq "I confirm that I am 18 years of age or older." <<<"$signup"
          dev_code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$APP_URL/dev/mentor-test")"
          [[ "$dev_code" == "404" ]]
      - name: Report smoke success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"success\",\"context\":\"final-public-smoke\",\"target_url\":\"$run_url\"}" >/dev/null
      - name: Report smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"failure\",\"context\":\"final-public-smoke\",\"target_url\":\"$run_url\"}" >/dev/null
      - name: Remove one-time smoke workflow
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-time-final-public-smoke.yml
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time final production smoke test"
            git push origin HEAD:main
          fi
