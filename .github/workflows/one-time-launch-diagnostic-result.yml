name: One-time launch diagnostic result

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-launch-diagnostic-result.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://app.mentorandi.com
      WEB_URL: https://mentorandi.com
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Capture diagnostic result
        shell: bash
        run: |
          set -u
          out=.launch-public-diagnostic.txt
          : > "$out"
          curl_meta() {
            local url="$1"
            printf '%s\n' "--- $url" >> "$out"
            meta="$(curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 --silent --show-error --location --output /tmp/body --write-out 'code=%{http_code} effective=%{url_effective}' "$url" 2>>"$out")"
            rc=$?
            printf '%s\n' "$meta" "rc=$rc" >> "$out"
          }

          for url in \
            "$APP_URL/api/health" \
            "$APP_URL/" \
            "$APP_URL/alpha" \
            "$APP_URL/demo" \
            "$APP_URL/match" \
            "$APP_URL/reflection" \
            "$APP_URL/welcome" \
            "$APP_URL/privacy" \
            "$APP_URL/terms" \
            "$APP_URL/pricing" \
            "$APP_URL/signup?plan=free" \
            "$APP_URL/dev/mentor-test" \
            "$WEB_URL/" \
            "$WEB_URL/ai-safety.html" \
            "$WEB_URL/terms.html" \
            "$WEB_URL/articles/attention-residue.html"; do
            curl_meta "$url"
          done

          printf '%s\n' '--- content-checks' >> "$out"
          curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 --fail --silent --show-error "$WEB_URL/ai-safety.html" -o /tmp/safety 2>>"$out" || true
          if grep -Fq 'Last updated: 25 August 2026' /tmp/safety 2>/dev/null; then echo 'safety_date=PASS' >> "$out"; else echo 'safety_date=FAIL' >> "$out"; fi
          if grep -Fq 'separate automated safety check' /tmp/safety 2>/dev/null; then echo 'safety_feature114=PASS' >> "$out"; else echo 'safety_feature114=FAIL' >> "$out"; fi
          if grep -Fq 'does not consume mentor credits' /tmp/safety 2>/dev/null; then echo 'safety_no_credit=PASS' >> "$out"; else echo 'safety_no_credit=FAIL' >> "$out"; fi

          curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 --fail --silent --show-error "$WEB_URL/terms.html" -o /tmp/terms 2>>"$out" || true
          if grep -Fq 'offers free and paid access' /tmp/terms 2>/dev/null; then echo 'terms_paid=PASS' >> "$out"; else echo 'terms_paid=FAIL' >> "$out"; fi
          if grep -Fq 'recurring subscriptions' /tmp/terms 2>/dev/null; then echo 'terms_subscription=PASS' >> "$out"; else echo 'terms_subscription=FAIL' >> "$out"; fi

          curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 --fail --silent --show-error "$WEB_URL/articles/attention-residue.html" -o /tmp/article 2>>"$out" || true
          if grep -Fq 'https://app.mentorandi.com/signup?plan=free' /tmp/article 2>/dev/null; then echo 'article_signup=PASS' >> "$out"; else echo 'article_signup=FAIL' >> "$out"; fi
          if grep -Fq '..https://app.mentorandi.com' /tmp/article 2>/dev/null; then echo 'article_malformed=FAIL' >> "$out"; else echo 'article_malformed=PASS' >> "$out"; fi

      - name: Commit result and remove workflow
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-time-launch-diagnostic-result.yml
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add -A
          git commit -m "Capture final launch public diagnostic"
          git push origin HEAD:main
