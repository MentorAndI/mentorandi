name: Feature 114 observable staging deploy

on:
  push:
    branches:
      - feature-114-compliance-runtime
    paths:
      - ".github/workflows/feature-114-staging-debug-deploy.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: mentorandi-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}

    steps:
      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"feature-114-observable-staging\",\"target_url\":\"$run_url\"}" >/dev/null

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/staging_deploy_key"
          chmod 600 "$HOME/.ssh/staging_deploy_key"
          ssh-keyscan -H -T 15 "$STAGING_SSH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build and replace staging with exact commit
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/staging_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          deploy_sha="$1"
          repo_dir="/docker/mentorandi"
          preview_dir="/docker/mentorandi-staging-preview-feature-114"
          preview_image="mentorandi-feature-114-preview:${deploy_sha}"

          before_created="$(docker inspect mentorandi-staging --format '{{.Created}}' 2>/dev/null || echo missing)"
          before_tag="$(docker inspect mentorandi-staging --format '{{.Config.Image}}' 2>/dev/null || echo missing)"
          printf 'BEFORE created=%s tag=%s\n' "$before_created" "$before_tag"

          cd "$repo_dir"
          git fetch origin feature-114-compliance-runtime
          git cat-file -e "$deploy_sha^{commit}"
          git worktree remove --force "$preview_dir" 2>/dev/null || true
          rm -rf "$preview_dir"
          git worktree add --force --detach "$preview_dir" "$deploy_sha"
          ln -s "$repo_dir/.env.staging" "$preview_dir/.env.staging"
          printf '%s\n' "$deploy_sha" > "$preview_dir/public/feature-114-preview-marker.txt"

          cat > "$preview_dir/docker-compose.preview.yml" <<EOF
          services:
            mentorandi-staging:
              image: ${preview_image}
              build:
                context: .
                dockerfile: Dockerfile
                args:
                  NEXT_PUBLIC_SUPABASE_URL: \${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in the staging env file}
                  NEXT_PUBLIC_SUPABASE_ANON_KEY: \${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY in the staging env file}
                  NEXT_PUBLIC_STRIPE_ENABLED: \${NEXT_PUBLIC_STRIPE_ENABLED:-false}
          EOF

          cd "$preview_dir"
          docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml --profile tools build mentorandi-staging-migrate
          docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml --profile tools run --rm -T mentorandi-staging-migrate </dev/null
          docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml -f docker-compose.preview.yml build --no-cache mentorandi-staging

          image_id="$(docker image inspect "$preview_image" --format '{{.Id}}')"
          image_marker="$(docker run --rm --entrypoint cat "$preview_image" /app/public/feature-114-preview-marker.txt)"
          printf 'BUILT image_id=%s marker_match=%s\n' "$image_id" "$( [ "$image_marker" = "$deploy_sha" ] && echo yes || echo no )"
          [ "$image_marker" = "$deploy_sha" ]

          resolved_image="$(docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml -f docker-compose.preview.yml config --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);process.stdout.write(c.services["mentorandi-staging"].image||"")})')"
          printf 'COMPOSE resolved_image=%s\n' "$resolved_image"
          [ "$resolved_image" = "$preview_image" ]

          docker compose -p mentorandi --env-file .env.staging -f docker-compose.staging.yml -f docker-compose.preview.yml up -d --force-recreate --no-deps mentorandi-staging

          after_created="$(docker inspect mentorandi-staging --format '{{.Created}}')"
          after_tag="$(docker inspect mentorandi-staging --format '{{.Config.Image}}')"
          after_marker="$(docker exec mentorandi-staging cat /app/public/feature-114-preview-marker.txt 2>/dev/null || true)"
          printf 'AFTER created=%s tag=%s marker_match=%s\n' "$after_created" "$after_tag" "$( [ "$after_marker" = "$deploy_sha" ] && echo yes || echo no )"
          [ "$after_tag" = "$preview_image" ]
          [ "$after_marker" = "$deploy_sha" ]
          REMOTE

      - name: Verify public staging
        id: public
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 18); do
            health="$(curl --connect-timeout 10 --max-time 20 --silent --show-error "${STAGING_APP_URL%/}/api/health" 2>/dev/null || true)"
            marker="$(curl --connect-timeout 10 --max-time 20 --silent --show-error "${STAGING_APP_URL%/}/feature-114-preview-marker.txt" 2>/dev/null || true)"
            health_ok="$(HEALTH="$health" node -e 'try{const h=JSON.parse(process.env.HEALTH||"");process.stdout.write(h.status==="ok"?"yes":"no")}catch{process.stdout.write("no")}' )"
            if [[ "$health_ok" == "yes" && "$marker" == "$GITHUB_SHA" ]]; then
              echo "PUBLIC health=ok marker_match=yes"
              exit 0
            fi
            sleep 5
          done
          echo "PUBLIC verification failed"
          exit 1

      - name: Publish final run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state=failure
          if [[ "$DEPLOY_OUTCOME" == "success" && "$PUBLIC_OUTCOME" == "success" ]]; then
            state=success
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"feature-114-observable-staging\",\"target_url\":\"$run_url\"}" >/dev/null
          [[ "$state" == "success" ]]
