name: One-time final launch dependency audit

on:
  push:
    branches:
      - health-peptides-launch-final
    paths:
      - ".github/workflows/one-time-final-launch-audit.yml"

permissions:
  contents: write
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Report audit pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"final-production-dependency-audit\",\"target_url\":\"$run_url\"}" >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: health-peptides-launch-final
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply lockfile-only audit fixes
        run: npm audit fix --package-lock-only
      - name: Reinstall resolved dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit safe lockfile remediation
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Remediate audited dependency vulnerabilities"
          git push origin HEAD:health-peptides-launch-final
      - name: Report audit success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"final-production-dependency-audit\",\"target_url\":\"$run_url\"}" >/dev/null
      - name: Report audit failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"final-production-dependency-audit\",\"target_url\":\"$run_url\"}" >/dev/null
