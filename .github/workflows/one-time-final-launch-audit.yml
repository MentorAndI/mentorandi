name: One-time final launch dependency audit

on:
  push:
    branches:
      - health-peptides-launch-final
    paths:
      - ".github/workflows/one-time-final-launch-audit.yml"

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report audit pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"final-production-dependency-audit\",\"target_url\":\"$run_url\"}" >/dev/null
      - uses: actions/checkout@v4
      - name: Build final standalone runtime image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder \
            --build-arg NEXT_PUBLIC_STRIPE_ENABLED=false \
            -t mentorandi-runtime-audit .
      - name: Verify vulnerable Prisma tooling is absent from runtime image
        run: |
          result="$(docker run --rm --entrypoint sh mentorandi-runtime-audit -c '
            set -eu
            found=0
            for pattern in deepmerge-ts "@prisma/config" "@prisma/dev"; do
              if find /app -type d -path "*/node_modules/$pattern" -print -quit | grep -q .; then
                echo "FOUND:$pattern"
                found=1
              else
                echo "ABSENT:$pattern"
              fi
            done
            exit "$found"
          ')"
          printf '%s\n' "$result"
          ! grep -q '^FOUND:' <<<"$result"
      - name: Report audit success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"final-production-dependency-audit\",\"target_url\":\"$run_url\"}" >/dev/null
      - name: Report audit failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"final-production-dependency-audit\",\"target_url\":\"$run_url\"}" >/dev/null
