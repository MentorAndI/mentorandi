name: One-time launch public diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-launch-public-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://app.mentorandi.com
      WEB_URL: https://mentorandi.com
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Diagnose public app and website
        shell: bash
        run: |
          set -u
          curl_meta() {
            local url="$1"
            echo "--- $url"
            curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 \
              --silent --show-error --location --output /tmp/body \
              --write-out 'code=%{http_code} effective=%{url_effective}\n' "$url"
            rc=$?
            echo "rc=$rc"
            head -c 220 /tmp/body 2>/dev/null | tr '\n' ' ' || true
            echo
          }

          for url in \
            "$APP_URL/api/health" \
            "$APP_URL/" \
            "$APP_URL/alpha" \
            "$APP_URL/demo" \
            "$APP_URL/match" \
            "$APP_URL/reflection" \
            "$APP_URL/welcome" \
            "$APP_URL/privacy" \
            "$APP_URL/terms" \
            "$APP_URL/pricing" \
            "$APP_URL/signup?plan=free" \
            "$APP_URL/dev/mentor-test" \
            "$WEB_URL/" \
            "$WEB_URL/ai-safety.html" \
            "$WEB_URL/terms.html" \
            "$WEB_URL/articles/attention-residue.html"; do
            curl_meta "$url"
          done

          echo '--- website content checks'
          curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 --fail --silent --show-error "$WEB_URL/ai-safety.html" -o /tmp/safety || true
          grep -F 'Last updated: 25 August 2026' /tmp/safety || true
          grep -F 'separate automated safety check' /tmp/safety || true
          curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 --fail --silent --show-error "$WEB_URL/terms.html" -o /tmp/terms || true
          grep -F 'offers free and paid access' /tmp/terms || true
          curl --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 --fail --silent --show-error "$WEB_URL/articles/attention-residue.html" -o /tmp/article || true
          if grep -F '..https://app.mentorandi.com' /tmp/article; then echo 'MALFORMED_SIGNUP_URL=YES'; else echo 'MALFORMED_SIGNUP_URL=NO'; fi

      - name: Remove one-time diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-time-launch-public-diagnostic.yml
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time launch public diagnostic"
            git push origin HEAD:main
          fi
