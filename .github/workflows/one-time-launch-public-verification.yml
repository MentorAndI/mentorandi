name: One-time launch public verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-launch-public-verification.yml"

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://app.mentorandi.com
      WEB_URL: https://mentorandi.com
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Report verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"launch-public-verification\",\"target_url\":\"$run_url\"}" >/dev/null

      - name: Verify public app
        shell: bash
        run: |
          set -Eeuo pipefail
          curl_retry() {
            curl --connect-timeout 10 --max-time 30 --retry 8 --retry-all-errors --retry-delay 5 --silent --show-error "$@"
          }

          health="$(curl_retry --fail "$APP_URL/api/health")"
          HEALTH="$health" node -e 'const h=JSON.parse(process.env.HEALTH||""); if(h.status!=="ok") process.exit(1)'

          effective="$(curl_retry --location --output /dev/null --write-out '%{url_effective}' "$APP_URL/")"
          [[ "$effective" == "$APP_URL/login"* ]]

          for route in alpha demo match reflection welcome; do
            effective="$(curl_retry --location --output /dev/null --write-out '%{url_effective}' "$APP_URL/$route")"
            [[ "$effective" == "$APP_URL/login"* ]]
          done

          effective="$(curl_retry --location --output /dev/null --write-out '%{url_effective}' "$APP_URL/privacy")"
          [[ "$effective" == "$WEB_URL/privacy.html"* ]]
          effective="$(curl_retry --location --output /dev/null --write-out '%{url_effective}' "$APP_URL/terms")"
          [[ "$effective" == "$WEB_URL/terms.html"* ]]

          pricing_code="$(curl_retry --output /dev/null --write-out '%{http_code}' "$APP_URL/pricing")"
          [[ "$pricing_code" == "200" ]]
          signup_code="$(curl_retry --output /dev/null --write-out '%{http_code}' "$APP_URL/signup?plan=free")"
          [[ "$signup_code" == "200" ]]
          dev_code="$(curl_retry --output /dev/null --write-out '%{http_code}' "$APP_URL/dev/mentor-test")"
          [[ "$dev_code" == "404" ]]

      - name: Verify synchronized marketing website
        shell: bash
        run: |
          set -Eeuo pipefail
          curl_retry() {
            curl --connect-timeout 10 --max-time 30 --retry 8 --retry-all-errors --retry-delay 5 --fail --silent --show-error "$@"
          }

          home="$(curl_retry "$WEB_URL/")"
          grep -Fq 'https://app.mentorandi.com/signup?plan=free' <<<"$home"
          grep -Fq '$19' <<<"$home"
          grep -Fq '$39' <<<"$home"
          grep -Fq '$69' <<<"$home"

          safety="$(curl_retry "$WEB_URL/ai-safety.html")"
          grep -Fq 'Last updated: 25 August 2026' <<<"$safety"
          grep -Fq 'separate automated safety check' <<<"$safety"
          grep -Fq 'does not consume mentor credits' <<<"$safety"

          terms="$(curl_retry "$WEB_URL/terms.html")"
          grep -Fq 'Last updated: 25 August 2026' <<<"$terms"
          grep -Fq 'offers free and paid access' <<<"$terms"
          grep -Fq 'recurring subscriptions' <<<"$terms"

          article="$(curl_retry "$WEB_URL/articles/attention-residue.html")"
          grep -Fq 'https://app.mentorandi.com/signup?plan=free' <<<"$article"
          if grep -Fq '..https://app.mentorandi.com' <<<"$article"; then
            echo 'Malformed relative signup URL remains' >&2
            exit 1
          fi

      - name: Report verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"launch-public-verification\",\"target_url\":\"$run_url\"}" >/dev/null

      - name: Report verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"launch-public-verification\",\"target_url\":\"$run_url\"}" >/dev/null

      - name: Remove one-time verification workflow
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-time-launch-public-verification.yml
          git config user.name "Mentor247"
          git config user.email "37156918+MentorAndI@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time launch public verification"
            git push origin HEAD:main
          fi
