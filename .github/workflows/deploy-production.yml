name: Deploy production

on:
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: Skip public health check while DNS is being moved
        required: false
        default: false
        type: boolean
      verify_billing_portal:
        description: Create and validate a live Customer Portal session without exposing its URL
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: mentorandi-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_APP_URL: https://app.mentorandi.com
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}

    steps:
      - name: Validate deployment connection
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Missing or invalid SSH host" >&2; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Missing or invalid SSH user" >&2; exit 1; }
          [[ -n "$SSH_KEY" ]] || { echo "Missing SSH key" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/production_deploy_key"
          chmod 600 "$HOME/.ssh/production_deploy_key"
          ssh-keyscan -H -T 15 "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy production containers
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/production_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            'set -eu
             cd /docker/mentorandi
             test -f .env.production || { echo ".env.production is missing" >&2; exit 1; }
             git fetch origin main
             git pull --ff-only origin main
             docker compose --env-file .env.production -f docker-compose.production.yml --profile tools build mentorandi-production-migrate
             docker compose --env-file .env.production -f docker-compose.production.yml --profile tools run --rm -e NODE_ENV=production --entrypoint node mentorandi-production-migrate scripts/check-env.mjs
             docker compose --env-file .env.production -f docker-compose.production.yml --profile tools run --rm mentorandi-production-migrate
             docker compose --env-file .env.production -f docker-compose.production.yml --profile tools run --rm mentorandi-production-rls
             docker compose --env-file .env.production -f docker-compose.production.yml up -d --build mentorandi-production'

      - name: Verify production health
        if: ${{ !inputs.skip_health_check }}
        shell: bash
        run: |
          set -Eeuo pipefail
          health_url="${PROD_APP_URL%/}/api/health"
          health_response="$(curl \
            --connect-timeout 10 \
            --fail \
            --max-time 20 \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --show-error \
            --silent \
            "$health_url")"

          HEALTH_RESPONSE="$health_response" node <<'NODE'
          try {
            const health = JSON.parse(process.env.HEALTH_RESPONSE ?? "");
            if (health.status !== "ok") process.exit(1);
            console.log("Production health check passed.");
          } catch {
            console.error("Production health response was invalid.");
            process.exit(1);
          }
          NODE

      - name: Verify production billing portal
        if: ${{ inputs.verify_billing_portal }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/production_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            'set -eu
             cd /docker/mentorandi
             docker compose --env-file .env.production -f docker-compose.production.yml run --rm -e NODE_ENV=production --entrypoint node mentorandi-production scripts/verify-production-portal.mjs'

      - name: Report production deploy status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state="error"
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
          elif [[ "$JOB_STATUS" == "failure" ]]; then
            state="failure"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(printf '{\"state\":\"%s\",\"context\":\"production-deploy\",\"description\":\"Production deploy %s\",\"target_url\":\"%s\"}' "$state" "$JOB_STATUS" "$run_url")"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
